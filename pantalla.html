<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla - Taller MED</title>
  <meta name="description" content="Pantalla de contenido del taller de Materiales Educativos Digitales">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <main class="med-canvas contenedor-pantalla" id="med-canvas">

    <header class="banda-superior">
      <div class="meta-nav">
        <div class="meta-group">
          <span id="breadcrumbs">Inicio > ...</span>
          <span class="contador-pantalla" id="contador-pantalla">Pantalla 1 de 17</span>
        </div>
        <div class="meta-group">
          <span class="auto-save-badge" id="auto-save-badge">
            <svg class="icono" viewBox="0 0 24 24" width="14" height="14"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
            Guardado
          </span>
          <span class="progreso-bar">
            <span id="progreso-pantalla-pct">0%</span>
            <span class="progreso-bar-track">
              <span class="progreso-bar-fill" id="progreso-pantalla-fill" style="width: 0%"></span>
            </span>
          </span>
        </div>
      </div>
      <div class="header-content">
        <div class="title-group">
          <span class="modulo-tag" id="modulo-tag">Módulo ...</span>
          <h1 id="titulo-pantalla">Cargando...</h1>
        </div>
        <button class="btn-outline" id="btn-salir" aria-label="Volver al inicio">
          <svg class="icono" viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
          Salir
        </button>
      </div>
    </header>

    <section class="sector-central">
      <!-- 1º Feedforward Ancho Completo -->
      <div class="caja-feedforward full-width" id="caja-feedforward">
        <svg viewBox="0 0 24 24"><path d="M11 17h2v-6h-2v6zm1-15C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zM11 9h2V7h-2v2z"/></svg>
        <div>
          <strong>Instrucciones</strong>
          <span id="feedforward-texto">...</span>
        </div>
      </div>

      <!-- 2º Doble columna adaptativa (sin roturas de ancho) -->
      <div class="columnas-wrapper">
        <article class="col-izquierda" id="col-izquierda">
          <h2>Saber Necesario</h2>
          <div class="caja-saber-necesario" id="texto-izquierda">
            Cargando contenido...
          </div>
          <!-- Contenedor inyectable exclusivo Pantalla 16 -->
          <div id="acreditacion-wrapper" style="display: none; width: 100%; margin-top: 24px;"></div>
        </article>

        <article class="col-derecha" id="col-derecha">
          <h2>Actividad Interactiva</h2>
          <div id="actividad-container">
            <p>Cargando actividad...</p>
          </div>
        </article>
      </div>

      <!-- 3º Guía (Abajo) -->
      <div class="nodo-guia full-width">
        <strong>Guía de Toma de Decisiones</strong>
        <span id="nodo-guia-texto">...</span>
      </div>
    </section>

    <section class="banda-ampliatorio" id="banda-ampliatorio">
      <span class="ampliatorio-text">Material ampliatorio y recursos de profundización:</span>
      <div class="cta-group" id="cta-group"></div>
    </section>

    <footer class="banda-inferior">
      <button class="btn-nav" id="btn-anterior" aria-label="Pantalla anterior">
        <svg class="icono" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        Anterior
      </button>

      <button class="btn-glosario" id="btn-glosario" aria-label="Abrir glosario">
        <svg class="icono" viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm7 2v6h7V5h-7zm0 8v6h7v-6h-7zM5 5v6h6V5H5zm0 8v6h6v-6H5z"/></svg>
        Glosario
      </button>

      <button class="btn-nav-primary" id="btn-siguiente" aria-label="Pantalla siguiente">
        Siguiente
        <svg class="icono" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
      </button>
    </footer>

  </main>

  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal-contenido">
      <button class="modal-cerrar-x" id="modal-cerrar-x" aria-label="Cerrar modal">&times;</button>
      <h3 id="modal-titulo">Título del modal</h3>
      <div id="modal-cuerpo"></div>
      <div id="modal-botones"></div>
    </div>
  </div>

  <script src="js/datos.js"></script>
  <script src="js/actividades.js"></script>
  <script src="js/progreso.js"></script>
</body>
</html>
